{{template "head" .Page}}
<div class="sheet">
<h1>new card</h1>
<form class="stack" method="post" action="/b/{{urlpath .Board}}/cards">
  <label for="title">TITLE</label>
  <input class="boxed" type="text" id="title" name="title" required autofocus>
  <label for="lane">LANE</label>
  <select class="boxed" id="lane" name="lane">{{range .Lanes}}<option value="{{.Key}}"{{if eq .Key $.Lane}} selected{{end}}>{{.}}</option>{{end}}</select>
  <div class="row"><button type="submit" class="primary">add</button><a class="muted" href="/b/{{urlpath .Board}}">cancel</a></div>
</form>
</div>
{{template "foot"}}
